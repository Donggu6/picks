<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>소개한 상품</title>
  <meta name="description" content="인스타그램에서 소개한 상품을 한곳에 모았어요.">
  <meta name="robots" content="noindex">
    <style>
    :root { --bg: #e9edf3; --card: #f5f7fa; --ink: #1a2030; --muted: #434c60; --edge: #2b3242; --accent: #5b46cc; --notice: #fff4e5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); background-image: radial-gradient(rgba(26,32,48,.09) 1px, transparent 1.2px); background-size: 14px 14px; color: var(--ink);
      font: 15px/1.6 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; word-break: keep-all; overflow-wrap: break-word; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
    .notice { margin: 0 -16px 20px; padding: 12px 16px; background: var(--notice); border-bottom: 2px solid var(--edge); font-size: 13px; font-weight: 600; }
    h1 { margin: 8px 0 4px; font: 700 33px/1.3 'Galmuri11', sans-serif; }
    .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .find { display: block; width: 100%; padding: 12px 14px; margin: 0 0 18px; border: 2px solid var(--edge); background: #fff; font: 15px 'Galmuri11', sans-serif; box-shadow: inset 2px 2px 0 rgba(26,32,48,.07); }
    .find:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
    ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    li { background: var(--card); border: 2px solid var(--edge); box-shadow: 4px 4px 0 var(--edge); padding: 14px 16px; display: grid; grid-template-columns: 52px 1fr; gap: 4px 14px; align-items: center; }
    .no { grid-row: span 2; display: grid; place-items: center; height: 52px; background: var(--accent); color: #fff; font: 700 22px 'Galmuri11', sans-serif; border: 2px solid var(--edge); }
    .name { margin: 0; font: 700 16px/1.45 'Galmuri11', sans-serif; }
    .go { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; background: var(--accent); color: #fff; text-decoration: none; border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--edge); font: 700 14px 'Galmuri11', sans-serif; }
    .go:active { transform: translate(3px,3px); box-shadow: none; }
    .go:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }
    .empty { padding: 18px; border: 2px dashed var(--edge); color: var(--muted); text-align: center; }
    .ig { display: inline-block; margin-top: 22px; color: var(--ink); font-weight: 700; }
    footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="notice">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
    <h1>소개한 상품</h1>
    <p class="sub">영상에 나온 번호나 이름으로 찾아보세요.</p>
    
    <p class="empty">아직 올린 상품이 없어요.</p>
    <ol data-list>
      </ol>
    
    <p class="empty" data-none hidden>찾는 상품이 없어요. 번호를 다시 확인해 주세요.</p>
    
    <footer>가격과 배송은 쿠팡 상품 페이지에서 확인해 주세요.</footer>
  </main>
  <script>
    (function () {
      var input = document.querySelector('[data-find]'); if (!input) return;
      var rows = [].slice.call(document.querySelectorAll('[data-list] li')), none = document.querySelector('[data-none]');
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase(), shown = 0;
        rows.forEach(function (li) { var hit = !q || li.getAttribute('data-search').toLowerCase().indexOf(q) >= 0; li.hidden = !hit; if (hit) shown++; });
        none.hidden = shown > 0;
      });
      // 릴스 키트의 "소개 페이지 바로 가기"(/picks/…#01): 그 번호 상품만 바로 보여 준다
      var want = decodeURIComponent((location.hash || '').slice(1));
      if (/^\d{1,3}$/.test(want)) { input.value = want.padStart(2, '0'); input.dispatchEvent(new Event('input')); }
    })();
  </script>
</body>
</html>
