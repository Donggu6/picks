# 무료 서버(Render)는 15분 동안 아무도 안 오면 잠들어 첫 접속이 50초쯤 걸린다. 10분마다 한 번 열어 깨워 둔다.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -o /dev/null -m 90 --retry 2 https://picksafe-9mub.onrender.com/health
